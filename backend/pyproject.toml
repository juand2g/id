description = "Sistema de Inteligencia Musical y Logger"
authors = ["Juand2g"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
numba = ">=0.59.0"
fastapi = "^0.127.1"
pymongo = "^4.15.5"
librosa = "^0.11.0"
shazamio = "^0.8.1"
numpy = "<2.4"
